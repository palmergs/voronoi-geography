[package]
name = "voronoi-geography"
version = "0.1.0"
edition = "2024"

[lib]
name = "voronoi_geography"
path = "src/lib.rs"

[[bin]]
name = "voronoi-geography"
path = "src/main.rs"

[dependencies]
glam = "0.33.7"
image = { version = "0.25.10", default-features = false, features = ["png"] }
noise = "0.9.0"
rand = "0.10.2"
rand_pcg = "0.10.2"
rayon = "1.12.0"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
